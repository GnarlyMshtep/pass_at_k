# Base DAPO configuration converted from matan_run_dapo_multatt.sh
# This config preserves the structure and comments from the original script
# Based on dapo_trainer.yaml with customizations for matan's multi-attempt setup

# Hydra configuration for config composition
hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# =============================================================================
# DATA CONFIGURATION
# =============================================================================

data:
  # Dataset paths - MUST be overridden by user
  train_files: ???
  val_files: ???
  
  # Dataset configuration
  prompt_key: prompt
  return_raw_chat: true
  truncation: 'error'
  filter_overlong_prompts: false
  shuffle: false
  
  # Token length parameters from matan_run
  max_prompt_length: 1024
  max_response_length: 2048
  
  # Batch size parameters from matan_run calculations
  train_batch_size: 32  # train_prompt_bsz
  gen_batch_size: 32    # gen_prompt_bsz (same as train_prompt_bsz * 1)

# =============================================================================
# MODEL AND ACTOR/ROLLOUT/REF CONFIGURATION  
# =============================================================================

actor_rollout_ref:
  # Model configuration
  model:
    path: "/mnt/xfs/home/aiilyas/rl-exploration/models/Qwen2_5-1_5B-Instruct"
    use_remove_padding: true
    enable_gradient_checkpointing: true

  # Actor configuration with performance settings from matan_run
  actor:
    # Performance and batch size settings
    use_dynamic_bsz: false
    ppo_mini_batch_size: 8  # train_prompt_mini_bsz (32/4)
    ppo_micro_batch_size_per_gpu: 32  # calculated from matan_run logic
    
    # Optimization settings from matan_run
    optim:
      lr: 1e-6
      lr_warmup_steps: 10
      weight_decay: 0.1
    
    # KL loss settings from matan_run
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    
    # PPO clipping from matan_run  
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    
    # Other actor settings from matan_run
    entropy_coeff: 0
    grad_clip: 1.0
    loss_agg_mode: "token-mean"
    
    # FSDP configuration from matan_run
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      forward_prefetch: true
    
    # Strategy and parallelism from matan_run
    ulysses_sequence_parallel_size: 1  # sp_size
    strategy: fsdp2
    
    # Compilation settings from matan_run
    use_torch_compile: false
    entropy_checkpointing: true

  # Reference model configuration
  ref:
    log_prob_micro_batch_size_per_gpu: 32  # ref_log_prob_micro_batch_size_per_gpu
    log_prob_use_dynamic_bsz: false
    
    # FSDP configuration
    fsdp_config:
      param_offload: true
      forward_prefetch: true
    
    ulysses_sequence_parallel_size: 1  # sp_size
    strategy: fsdp2
    use_torch_compile: false
    entropy_checkpointing: true

  # Rollout configuration with vllm settings from matan_run
  rollout:
    name: vllm
    n: 8  # n_resp_per_prompt
    
    # vLLM performance settings from matan_run
    tensor_model_parallel_size: 1  # gen_tp
    gpu_memory_utilization: 0.6
    enable_chunked_prefill: false
    max_num_batched_tokens: 3072  # max_prompt_length + max_response_length
    
    # Generation parameters from matan_run
    temperature: 0.1
    top_p: 1.0
    top_k: -1
    
    # Validation generation parameters from matan_run
    val_kwargs:
      temperature: 0.1
      top_p: 1.0
      top_k: -1
      do_sample: true
      n: 8  # n_resp_per_prompt
    
    # Other rollout settings from matan_run
    log_prob_micro_batch_size_per_gpu: 32  # rollout_log_prob_micro_batch_size_per_gpu
    log_prob_use_dynamic_bsz: false
    update_weights_bucket_megabytes: 512

# =============================================================================
# ALGORITHM CONFIGURATION
# =============================================================================

algorithm:
  # Advantage estimator from matan_run
  adv_estimator: grpo
  
  # KL settings from matan_run
  use_kl_in_reward: false
  kl_ctrl:
    kl_coef: 0.0
  
  # Filter groups configuration from matan_run
  filter_groups:
    enable: false
    metric: acc
    max_num_gen_batches: 10

# =============================================================================
# REWARD MODEL CONFIGURATION
# =============================================================================

# Reward model configuration 
reward_model:
  reward_manager: dapo
  strategy: fsdp2
  
  # Overlong buffer settings from matan_run (currently disabled)
  overlong_buffer:
    enable: false
    len: 2048
    penalty_factor: 1.0
    log: false

# =============================================================================  
# CRITIC CONFIGURATION
# =============================================================================

critic:
  strategy: fsdp2

# =============================================================================
# CUSTOM REWARD FUNCTION
# =============================================================================

# Custom reward function from matan_run with multi-attempt scoring
# Note: N_ROLLOUTS=3 is hardcoded in compute_score_multi_attempt_per_rollout
custom_reward_function:
  path: "/mnt/xfs/home/aiilyas/rl-exploration/pass_at_k/custom/reward/reward_utils.py"
  name: "compute_score_multi_attempt_per_rollout"

# =============================================================================
# TRAINER CONFIGURATION  
# =============================================================================

trainer:
  # Project and experiment naming from matan_run
  project_name: 'matan'
  experiment_name: ???  # MUST be overridden by user
  
  # Logging configuration from matan_run
  logger: ["console","wandb"]
  log_val_generations: false
  
  # Hardware configuration from matan_run
  n_gpus_per_node: 2  # n_gpu
  nnodes: 1
  
  # Training configuration from matan_run
  total_epochs: 1
  val_before_train: false
  critic_warmup: 0
  test_freq: 50000
  save_freq: 60
  
  # Directory configuration - MUST be overridden by user
  default_local_dir: ???
  
  # Resume configuration from matan_run
  resume_mode: disable
  
  # Rollout data directories - MUST be overridden by user
  rollout_data_dir: ???
  validation_data_dir: ???

# Additional trainer configuration for rollout dumping from matan_run
+trainer:
  rollout:
    dump_freq: 3
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rollout Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <button class="nav-back" id="navBack" title="Back">⟵ Back</button>
      <div class="brand">Rollout Viewer</div>
      <div class="root-path" id="rootPath"></div>
      <div class="controls">
        <label>Filter key
          <select id="filterKey"><option value="">Any</option></select>
        </label>
        <label>Filter value
          <input type="text" id="searchBox" placeholder="Type to filter..." />
        </label>
        <label>Page size
          <input type="number" id="pageSize" min="1" max="500" value="50" />
        </label>
      </div>
    </header>

    <main class="app-main">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <input id="treeFilter" type="text" placeholder="Filter..." />
        </div>
        <div class="tree" id="tree"></div>
      </aside>

      <section class="content" id="content">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="file-meta" id="fileMeta"></div>
        <div class="entries" id="entries"></div>
        <button id="loadMore" class="load-more" hidden>Load more</button>
      </section>
    </main>

    <footer class="app-footer">
      <span>Resize text blocks by dragging their corner. Scroll to auto-load more.</span>
    </footer>

    <script src="/app.js" defer></script>
  </body>
  </html>
